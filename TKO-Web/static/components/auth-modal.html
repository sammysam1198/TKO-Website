<div id="authSection">
    <div id="loggedOutView">
        <button id="openSigninBtn" class="auth-btn signin">Sign In</button>
        <button id="openSignupBtn" class="auth-btn signup">Sign Up</button>
    </div>

    <div id="loggedInView" class="hidden">
        <div class="account-menu">
            <button id="accountMenuToggle" class="profile-bubble" type="button">
                <span id="profileName">👤 User</span>
            </button>

            <div id="accountDropdown" class="account-dropdown hidden">
                <button id="openSettingsBtn">Account Settings</button>
                <button id="openAppearanceBtn">Appearance</button>
                <button id="openAccessibilityBtn">Accessibility</button>
                <button id="openChangePasswordBtn">Change Password</button>
                <button id="openAdminPanelBtn" class="hidden">Admin Panel</button>
                <hr />
                <button id="logoutBtn">Log Out</button>
            </div>
        </div>
    </div>
</div>

<div id="authModal" class="auth-modal hidden">
    <div class="auth-modal-backdrop"></div>

    <div class="auth-modal-content">
        <button id="closeAuthModal" class="auth-close-btn" type="button" aria-label="Close modal">×</button>

        <div class="auth-tabs">
            <button id="showSignUpTab" class="auth-tab active" type="button">Sign Up</button>
            <button id="showSignInTab" class="auth-tab" type="button">Sign In</button>
        </div>

        <div id="authMessage" class="auth-message"></div>

        <form id="signUpForm" class="auth-form">
            <h2>Create Account</h2>

            <label for="signupFirstName">First Name</label>
            <input id="signupFirstName" name="first_name" type="text" required />

            <label for="signupLastName">Last Name</label>
            <input id="signupLastName" name="last_name" type="text" required />

            <label for="signupEmail">Email</label>
            <input id="signupEmail" name="email" type="email" required />

            <label for="signupUsername">Username</label>
            <input id="signupUsername" name="username" type="text" required />

            <label for="signupPassword">Password</label>
            <input id="signupPassword" name="password" type="password" required />

            <label class="auth-checkbox">
                <input id="signupTerms" name="agreed_to_terms" type="checkbox" required />
                <span>I agree to the terms</span>
            </label>

            <button class="auth-submit signup-submit" type="submit">Create Account</button>
        </form>

        <form id="signInForm" class="auth-form hidden">
            <h2>Welcome Back</h2>

            <label for="signinLogin">Username or Email</label>
            <input id="signinLogin" name="login" type="text" required />

            <label for="signinPassword">Password</label>
            <input id="signinPassword" name="password" type="password" required />

            <button class="auth-submit signin-submit" type="submit">Sign In</button>
        </form>
    </div>
</div>
